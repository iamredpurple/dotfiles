<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer CaskaydiaMono over the distro default (Noto Sans Mono) for the
       generic monospace family. Loaded via /etc/fonts/conf.d/50-user.conf,
       which runs before 60-latin.conf injects Noto Sans Mono. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaMono Nerd Font</family>
      <family>CaskaydiaMono NF</family>
    </prefer>
  </alias>
</fontconfig>
