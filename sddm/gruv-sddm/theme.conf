[General]
# Background image (relative path to theme directory, e.g. 'wallpaper.jpg')
background=arch.jpg
#matt-default.jpg
# User avatar image (leave blank to hide)
avatar=av.jpg
# Panel alignment: left, center, right
alignment=left
# Margin from the edge (only applies if alignment is left or right)
margin=100
# Show username input field (set to false for single-user systems)
showUsername=false

# Colors
primaryColor="#000000"
accentColor="#ffffff"
inputColor="#ffffff"
fontFamily="Font"
